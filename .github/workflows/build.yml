name: build

# 干净机器上验证「clone → 一条命令 → 出插件」。
# 三个仓各 checkout 到独立目录，然后跑 ./scripts/build.sh。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14            # arm64 机器；universal 需要两个 target
    env:
      RUSTOMP_TAG: v0.1.0
      PACKER_TAG: v0.1.5
    steps:
      - uses: actions/checkout@v4
        with:
          path: sparklin-drive

      # 三个仓都 checkout 到同一个目录（同级）——和 build.sh 的"同级目录"约定一致，
      # 所以不需要 RUSTOMP_ROOT / RUSTOMP_MAC_PLUGIN 任何环境变量。
      - name: Checkout framework (rustomp)
        uses: actions/checkout@v4
        with:
          repository: amonisachicken/rustomp
          ref: ${{ env.RUSTOMP_TAG }}
          path: rustomp

      - name: Checkout packer (rustomp-mac-plugin)
        uses: actions/checkout@v4
        with:
          repository: amonisachicken/rustomp-mac-plugin
          ref: ${{ env.PACKER_TAG }}
          path: rustomp-mac-plugin

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sparklin-drive

      - name: cmake
        run: brew install cmake

      - name: cargo-nih-plug
        # 打包靠这个 cargo 子命令，必须与 rustomp-mac-plugin/deps.lock 里的 nih-plug rev 一致
        run: cargo install --git https://github.com/robbert-vdh/nih-plug.git --rev de42101 cargo-nih-plug --locked

      - name: Fetch packer third-party sources
        working-directory: rustomp-mac-plugin
        run: ./scripts/fetch-third-party.sh

      - name: Doctor
        working-directory: sparklin-drive
        run: ./scripts/build.sh doctor          # 同级目录自动发现，无环境变量

      - name: Test
        working-directory: sparklin-drive
        run: ./scripts/build.sh test

      - name: Build (AU/VST3/CLAP, no install)
        working-directory: sparklin-drive
        run: |
          set -o pipefail            # 关键：没有它，`| tee` 会让失败变成成功
          ./scripts/build.sh --no-install 2>&1 | tee /tmp/build.log

      - name: Collect artifacts
        working-directory: sparklin-drive
        run: |
          set -euo pipefail
          mkdir -p dist
          n=0
          while IFS= read -r p; do
            cp -R "$p" dist/; n=$((n+1))
          done < <(grep '^ARTIFACT: ' /tmp/build.log | sed 's/^ARTIFACT: //')
          echo "收集到 $n 个产物"
          ls -la dist
          [ "$n" -ge 1 ] || { echo "✗ 没有产物，构建其实是失败的"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sparklin-drive-macos
          path: sparklin-drive/dist
          if-no-files-found: error
